[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-calculus"
version = "0.1.0a23"
description = "Alpha research workbench and executable calculus for ascent sequences"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ac-workbench = "ac.gui.server:main"
ac-workbench-desktop = "ac.gui.desktop:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
solver = ["z3-solver>=4.13"]
desktop = []
desktop-build = ["pyinstaller>=6.11"]

[tool.setuptools.package-data]
"ac.gui.static" = ["*.html", "*.css", "*.js"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ac", "ac.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
