[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-calculus"
version = "0.1.0a27"
description = "Alpha research workbench and executable calculus for ascent sequences"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ac-research-library = "ac.research_library:main"
ac-workbench = "ac.gui.server:main"
ac-workbench-desktop = "ac.gui.desktop:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
solver = ["z3-solver>=4.13"]
desktop = []
desktop-build = ["pyinstaller>=6.11"]

[tool.setuptools.package-data]
"ac.gui.static" = ["*.html", "*.css", "*.js"]
"ac.research_data" = ["manifest.json", "root/docs/research/*/*.json", "root/ac/*.py", "root/ac/*/*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ac", "ac.*"]
exclude = ["ac.research_data.root*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
