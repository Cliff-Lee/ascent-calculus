name: macOS alpha release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies and run focused regression
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/test_gui1_viewmodel.py \
            tests/test_e11_proof_extraction.py \
            tests/test_e9_local_repair.py
      - name: Build app, disk image, zip, and Python wheel
        run: ./scripts/build_macos.sh
      - name: Attach app and wheel to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/AscentCalculus-macos-arm64/* \
            --clobber
