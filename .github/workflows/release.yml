name: Cross-platform alpha release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Focused regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused regression
        run: >-
          python -m pytest -q
          tests/test_gui1_viewmodel.py
          tests/test_gui3_experiments.py
          tests/test_gui3_transform_experiments.py
          tests/test_e11_proof_extraction.py
          tests/test_e9_local_repair.py

  prepare-release:
    name: Prepare prerelease
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Read package version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create prerelease if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## GUI-3 research workbench

          This alpha expands Ascent Calculus from a curated proof/research interface into a more general bounded experiment workbench.

          ### New in this alpha
          - Generic count and comparison experiments for ordinary, modified, and revised ascent sequences
          - Multiple avoid/contain pattern restrictions and degree shifts
          - Refinements by ascents, runs, maximum, multiplicity, and occurrence-position profiles
          - Object browsing, first-divergence witnesses, and structural inspection
          - Class-wide audits for reverse, complement, hat/inverse-hat, prefix lifts, position insertion, and single-position deletion
          - Degree-changing checks for n -> n+1 and n -> n-1
          - Collision detection, target coverage, and inverse-recovery reporting
          - Deletion with ambient restriction, retaining empty value levels

          ### Validation
          The release workflow runs the focused GUI-1/GUI-3/E11 regression suite on macOS, Windows, and Ubuntu before packaging. Finite computational verification is evidence, not an all-degree proof.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Ascent Calculus $VERSION — GUI-3 research workbench" --prerelease --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Ascent Calculus $VERSION — GUI-3 research workbench" --prerelease --notes-file /tmp/release-notes.md
          fi

  macos-arm64:
    needs: prepare-release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app, disk image, zip, and Python wheel
        run: ./scripts/build_macos.sh
      - name: Attach app and wheel to the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: >-
          gh release upload "$TAG"
          dist/AscentCalculus-macos-arm64/*.dmg
          dist/AscentCalculus-macos-arm64/*.zip
          dist/AscentCalculus-macos-arm64/*.whl
          --clobber

  windows-x64:
    needs: prepare-release
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows installer and Python wheel
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Attach installer to the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -Path "dist/AscentCalculus-windows-x64" -Filter "*-windows-x64-setup.exe").FullName
          gh release upload $env:TAG $installer --clobber

  ubuntu-amd64:
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 dpkg-dev
      - name: Build Ubuntu package and Python wheel
        run: ./scripts/build_ubuntu.sh
      - name: Attach installer to the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$TAG" dist/AscentCalculus-ubuntu-24.04-amd64/*.deb --clobber
