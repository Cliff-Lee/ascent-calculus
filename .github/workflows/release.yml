name: Cross-platform alpha release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: Focused regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run focused regression
        run: >-
          python -m pytest -q
          tests/test_gui1_viewmodel.py
          tests/test_gui3_experiments.py
          tests/test_gui3_transform_experiments.py
          tests/test_research_state.py
          tests/test_e11_proof_extraction.py
          tests/test_e9_local_repair.py

  macos-arm64:
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app, disk image, zip, and Python wheel
        run: bash scripts/build_macos.sh
      - name: Upload tested macOS app for device testing
        uses: actions/upload-artifact@v4
        with:
          name: AscentCalculus-macos-arm64-a22
          path: |
            dist/AscentCalculus-macos-arm64/*.dmg
            dist/AscentCalculus-macos-arm64/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Print macOS launch diagnostics on failure
        if: failure()
        run: |
          log="$HOME/Library/Logs/AscentCalculus/startup.log"
          if [[ -f "$log" ]]; then cat "$log"; else echo "No startup log was created."; fi
      - name: Attach app and wheel to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          dist/AscentCalculus-macos-arm64/*.dmg
          dist/AscentCalculus-macos-arm64/*.zip
          dist/AscentCalculus-macos-arm64/*.whl
          --clobber

  windows-x64:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows installer and Python wheel
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Install and smoke-test the Windows installer
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -Path "dist/AscentCalculus-windows-x64" -Filter "*-windows-x64-setup.exe").FullName
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Windows installer failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs\Ascent Calculus\AscentCalculus.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed app executable not found: $installedExe" }
          $smoke = Start-Process -FilePath $installedExe -ArgumentList "--startup-check" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed app startup check failed: $($smoke.ExitCode)" }
          $windowSmoke = Start-Process -FilePath $installedExe -ArgumentList "--window-smoke-check" -Wait -PassThru
          if ($windowSmoke.ExitCode -ne 0) { throw "Installed app window check failed: $($windowSmoke.ExitCode)" }
      - name: Upload tested Windows installer for device testing
        uses: actions/upload-artifact@v4
        with:
          name: AscentCalculus-windows-x64-a22
          path: dist/AscentCalculus-windows-x64/*
          if-no-files-found: error
          retention-days: 14
      - name: Print Windows launch diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:USERPROFILE ".ascent-calculus\startup.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No startup log was created." }
      - name: Attach installer and wheel to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -Path "dist/AscentCalculus-windows-x64" -Filter "*-windows-x64-setup.exe").FullName
          gh release upload $env:GITHUB_REF_NAME $installer --clobber

  ubuntu-amd64:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-tk dpkg-dev xvfb openbox dbus-x11 imagemagick
      - name: Build Ubuntu package and Python wheel
        run: bash scripts/build_ubuntu.sh
      - name: Install and smoke-test the Ubuntu package
        run: |
          package=$(find dist/AscentCalculus-ubuntu-24.04-amd64 -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          sudo dpkg -i "$package"
          ascent-calculus --startup-check
          xvfb-run -a dbus-run-session -- sh -c 'openbox >/tmp/ascent-openbox.log 2>&1 & wm_pid=$!; trap "kill $wm_pid 2>/dev/null || true" EXIT; ascent-calculus --window-smoke-check'
      - name: Capture native desktop UX previews
        run: |
          preview_dir="$GITHUB_WORKSPACE/dist/AscentCalculus-ubuntu-24.04-amd64"
          mkdir -p "$preview_dir"
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- bash -c '
            set -e
            openbox >/tmp/ascent-preview-openbox.log 2>&1 &
            wm_pid=$!
            PYTHONPATH=/usr/lib/ascent-calculus /usr/bin/python3 scripts/desktop_preview.py &
            app_pid=$!
            trap "kill $app_pid $wm_pid 2>/dev/null || true" EXIT
            sleep 4.0
            import -window root "$GITHUB_WORKSPACE/dist/AscentCalculus-ubuntu-24.04-amd64/preview-conjecture.png"
            sleep 2.0
            import -window root "$GITHUB_WORKSPACE/dist/AscentCalculus-ubuntu-24.04-amd64/preview-transform.png"
            wait "$app_pid"
          '
      - name: Capture compact laptop workspace preview
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash -c '
            set -e
            openbox >/tmp/ascent-compact-openbox.log 2>&1 &
            wm_pid=$!
            PYTHONPATH=/usr/lib/ascent-calculus /usr/bin/python3 scripts/desktop_preview.py &
            app_pid=$!
            trap "kill $app_pid $wm_pid 2>/dev/null || true" EXIT
            sleep 4
            import -window root "$GITHUB_WORKSPACE/dist/AscentCalculus-ubuntu-24.04-amd64/preview-conjecture-compact.png"
            wait "$app_pid"
          '
      - name: Upload tested Ubuntu package for device testing
        uses: actions/upload-artifact@v4
        with:
          name: AscentCalculus-ubuntu-amd64-a22
          path: dist/AscentCalculus-ubuntu-24.04-amd64/*
          if-no-files-found: error
          retention-days: 14
      - name: Print Ubuntu launch diagnostics on failure
        if: failure()
        run: |
          log="$HOME/.ascent-calculus/startup.log"
          if [[ -f "$log" ]]; then cat "$log"; else echo "No startup log was created."; fi
      - name: Attach installer and wheel to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/AscentCalculus-ubuntu-24.04-amd64/*.deb --clobber
