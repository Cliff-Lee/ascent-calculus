name: Import GUI-3 source bundle

on:
  push:
    branches: [gui3-release-a7]
    paths:
      - "IMPORT_READY"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gui3-release-a7
      - name: Reassemble and import validated source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .import/part-*.b64 > /tmp/gui3-source.b64
          base64 --decode /tmp/gui3-source.b64 > /tmp/gui3-source.tar.gz
          mkdir -p /tmp/gui3-source
          tar -xzf /tmp/gui3-source.tar.gz -C /tmp/gui3-source
          SRC="$(find /tmp/gui3-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          rsync -a --exclude '.git' "$SRC"/ ./
          rm -rf .import IMPORT_READY .github/workflows/import-gui3.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Import GUI-3 research workbench source"
          git push origin HEAD:gui3-release-a7
