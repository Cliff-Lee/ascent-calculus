name: Import GUI-3 source

on:
  push:
    branches: [main]
    paths:
      - ascent-calculus-0.1.0a7-source.tar.gz
      - .github/workflows/import-gui3.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for staged source bundle
        id: bundle
        run: |
          if [ -f ascent-calculus-0.1.0a7-source.tar.gz ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify source bundle
        if: steps.bundle.outputs.present == 'true'
        run: echo "ad286e38f0cc71f9179cf4d253bca4fb9d89b466c76a59bcea53657f70c2ed24  ascent-calculus-0.1.0a7-source.tar.gz" | sha256sum -c -
      - name: Import exact tested source tree
        if: steps.bundle.outputs.present == 'true'
        run: |
          tar -xzf ascent-calculus-0.1.0a7-source.tar.gz --strip-components=1 -C .
          rm ascent-calculus-0.1.0a7-source.tar.gz
      - name: Commit imported source
        if: steps.bundle.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish GUI-3 research workbench source" || exit 0
          git push
