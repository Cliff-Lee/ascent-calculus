name: Import GUI-3 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ hashFiles('ascent-calculus-0.1.0a7-source.tar.gz') != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify source bundle
        run: echo "44fe46c0bd6edf7b83a8c09d113201ae6ee17e220224ab9ec589a8a2c0e62a4e  ascent-calculus-0.1.0a7-source.tar.gz" | sha256sum -c -
      - name: Import exact tested source tree
        run: |
          tar -xzf ascent-calculus-0.1.0a7-source.tar.gz -C .
          rm ascent-calculus-0.1.0a7-source.tar.gz
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish GUI-3 research workbench source" || exit 0
          git push
