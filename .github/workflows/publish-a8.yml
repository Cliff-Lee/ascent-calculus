name: Publish Ascent Calculus 0.1.0a8

on:
  push:
    branches: [main]
    paths:
      - ".release-a8/READY"

permissions:
  contents: write

jobs:
  test:
    name: Focused regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run GUI-3 focused regression
        run: >-
          python -m pytest -q
          tests/test_gui1_viewmodel.py
          tests/test_gui3_experiments.py
          tests/test_gui3_transform_experiments.py
          tests/test_e11_proof_extraction.py
          tests/test_e9_local_repair.py

  macos-arm64:
    needs: test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS app, DMG and ZIP
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/AscentCalculus-macos-arm64/*.dmg
            dist/AscentCalculus-macos-arm64/*.zip
          if-no-files-found: error

  windows-x64:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows x64 installer
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/AscentCalculus-windows-x64/*-windows-x64-setup.exe
          if-no-files-found: error

  ubuntu-amd64:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 dpkg-dev
      - name: Build Ubuntu 24.04 amd64 package
        run: bash scripts/build_ubuntu.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-amd64
          path: dist/AscentCalculus-ubuntu-24.04-amd64/*.deb
          if-no-files-found: error

  publish:
    needs: [macos-arm64, windows-x64, ubuntu-amd64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build Python wheel
        run: python -m pip wheel --no-deps . --wheel-dir release-assets
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test "$(find release-assets -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*-macos-arm64.zip' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*-windows-x64-setup.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
      - name: Publish v0.1.0a8 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## GUI-3 research workbench alpha

          This release turns Ascent Calculus further toward an open-ended experimental research tool.

          ### New research workflow

          - Universal experiment builder for ordinary, modified and revised ascent sequences
          - Class counting and bounded comparison experiments
          - Pattern containment/avoidance restrictions
          - Structural refinements and degree shifts
          - Generic transformation workbench
          - Position insertion with n -> n+1
          - Single-position deletion with n -> n-1
          - Collision detection and distinct-image counts
          - Target coverage / missing-target reporting
          - Inverse-recovery checks
          - Explicit source and target degree reporting
          - Ambient-restriction deletion semantics, preserving empty value levels

          ### Validation

          The GUI-3 source publication passed 57 focused tests together with Python compilation and git diff --check.
          The release pipeline reruns the focused regression on macOS, Windows and Ubuntu before any release is published.

          Ascent Calculus is experimental research software. Finite verification is evidence, not an all-degree proof.
          EOF
          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f -print0)
          gh release create v0.1.0a8 "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Ascent Calculus 0.1.0a8 — GUI-3 research workbench" \
            --notes-file /tmp/release-notes.md \
            --prerelease
