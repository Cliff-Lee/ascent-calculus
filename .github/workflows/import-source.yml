name: One-shot GUI-3 source import

on:
  push:
    paths:
      - ".source-import/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source-import/chunk-* > /tmp/ascent-source.b64
          base64 --decode /tmp/ascent-source.b64 > /tmp/ascent-source.tar.gz
          echo "ad286e38f0cc71f9179cf4d253bca4fb9d89b466c76a59bcea53657f70c2ed24  /tmp/ascent-source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/ascent-source
          tar -xzf /tmp/ascent-source.tar.gz -C /tmp/ascent-source
          root="$(find /tmp/ascent-source -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$root"
          rsync -a "$root"/ ./

      - name: Validate imported source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q             tests/test_gui1_viewmodel.py             tests/test_e11_proof_extraction.py             tests/test_e9_local_repair.py             tests/test_gui3_experiments.py             tests/test_gui3_transform_experiments.py
          python -m compileall -q ac
          git diff --check

      - name: Commit exact GUI-3 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-import
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import GUI-3 research workbench source"
          git push origin HEAD:main
