name: One-shot GUI-3 delta import

on:
  push:
    paths:
      - ".source-import/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct GUI-3 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .source-import/chunk-* > /tmp/ascent-delta.b64
          base64 --decode /tmp/ascent-delta.b64 > /tmp/ascent-delta.tar.gz
          echo "0895b111c38d624a5efa7b3837eda5f62664e7aa1b14f29df8f6e180c4e9db59  /tmp/ascent-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ascent-delta.tar.gz -C .

      - name: Validate imported GUI-3 source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q \
            tests/test_gui1_viewmodel.py \
            tests/test_e11_proof_extraction.py \
            tests/test_e9_local_repair.py \
            tests/test_gui3_experiments.py \
            tests/test_gui3_transform_experiments.py
          python -m compileall -q ac
          git diff --check

      - name: Commit GUI-3 delta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-import
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import GUI-3 research workbench source"
          git push origin HEAD:main
